<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CodePalma</title>
  <meta name="description" content="Ciência da computação na palma da mão: estante de livros, guia de entrevista e postura, cartões de estudo, ferramentas e diário de problemas." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#3B3486" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <header class="topbar">
    <a class="brand" href="#/estante" aria-label="CodePalma, início"><span class="prompt">&gt;_</span> Code<span>Palma</span></a>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Seções">
    <a href="#/estante" data-nav="estante"><span class="ico" aria-hidden="true">📚</span>Estante</a>

    <a href="#/carreira" data-nav="carreira"><span class="ico" aria-hidden="true">💼</span>Carreira</a>
  </nav>

  <dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>

</html>
