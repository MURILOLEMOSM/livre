# CodePalma: site estático. No Netlify, crie um site novo com "Base directory" = computacao
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=(), payment=()"
    # Livros: Google Books e Open Library (dados e capas). data:/blob: para fotos, backup e PDFs salvos.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: https://www.googleapis.com https://openlibrary.org https://covers.openlibrary.org https://books.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
