# Site estático + funções do servidor (lembrete, Disputa, avisos, excluir conta)
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # o firebase-admin não se dá bem empacotado; vai junto como pacote normal
  external_node_modules = ["firebase-admin", "web-push"]

# ---------- Arquivos internos: existem no repositório, mas não ficam públicos ----------
[[redirects]]
  from = "/netlify/functions/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/lib/firebase.mjs"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/firebase/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/preview/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/store/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/readme.md"
  to = "/404"
  status = 404
  force = true

# ---------- Cabeçalhos de segurança em todas as páginas ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://livre-c7d31.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# O service worker nunca pode ficar preso em cache do navegador
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Verificação do app Android (Play Store): precisa ser JSON
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
